# The whole product on one VM. PostgreSQL is not here: it is Nebius Managed
# PostgreSQL, reached over the private network (see docs/DEPLOY.md).
#
#   cd deploy && docker compose up -d --build

services:
  frontend:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.frontend
    restart: unless-stopped
    expose:
      - "3000"

  backend:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.backend
    restart: unless-stopped
    # Provider keys and tuning live in deploy/.env: NEBIUS_*, AMASS_*,
    # ELEVENLABS_API_KEY, HEALTH_AGENT_BACKEND_TOKEN. Everything in that file is
    # passed to the container; the block below overrides anything of the same name,
    # so deployment-specific settings always win.
    env_file:
      - .env
    environment:
      # Managed PostgreSQL connection string.
      DATABASE_URL: ${DATABASE_URL:?set DATABASE_URL in deploy/.env}
      # Exact public origin, no wildcard: CORS runs with credentials.
      ALLOWED_ORIGINS: ${PUBLIC_URL:?set PUBLIC_URL in deploy/.env}
      # The public URL is HTTPS, so session cookies must be marked Secure.
      SECURE_COOKIES: "1"
    volumes:
      # Managed PostgreSQL presents a certificate from a private Nebius CA, so
      # sslmode=verify-full needs the CA on disk. Not a secret; see docs/DEPLOY.md.
      - ${CA_CERT_PATH:-/opt/longevity/certs/ca.pem}:/etc/ssl/nebius/ca.pem:ro
      # Uploaded documents are written to disk, so they must outlive the container:
      # without this, every `docker compose up --build` silently loses them.
      - uploads:/app/.uploads
    expose:
      - "8000"

  proxy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      # The tunnel agent on the host connects to this.
      - "127.0.0.1:8080:8080"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
    depends_on:
      - frontend
      - backend

volumes:
  uploads:
